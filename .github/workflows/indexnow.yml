name: IndexNow

# Vercel reports each deployment back to GitHub. Once a production deploy is
# live, ping IndexNow so Bing recrawls the site.
on: deployment_status

jobs:
  ping:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs
